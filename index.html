<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BlackBerry КВ — слоты месяца</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true">
    <div class="fog fog-a"></div>
    <div class="fog fog-b"></div>
    <div class="grid"></div>
  </div>

  <main class="wrap">
    <header class="hero">
      <div class="hero-brand">
        <img class="crest" src="assets/blackberry.png" alt="BlackBerry" width="160" height="160" />
        <div class="hero-copy">
          <h1>BLACKBERRY</h1>
          <p class="tagline" id="title">КВ — слоты месяца</p>
        </div>
      </div>
      <div class="hero-stats" id="stats"></div>
    </header>

    <section class="board">
      <div class="board-head">
        <h2>Все слоты месяца</h2>
        <p class="board-sub">Тикеты — наши : их · клик по строке — стата игроков</p>
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Дата</th>
              <th class="num">МСК</th>
              <th>Соперник</th>
              <th>Карта</th>
              <th class="ctr">Формат</th>
              <th>Сервер</th>
              <th class="ctr">Состав</th>
              <th class="ctr">Счёт</th>
              <th class="num">R1</th>
              <th class="num">R2</th>
              <th>Статус</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p class="note" id="note"></p>
    </section>
  </main>

  <div class="modal" id="match-modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header class="modal-head">
        <div>
          <h2 id="modal-title">Катка</h2>
          <p class="modal-sub" id="modal-sub"></p>
        </div>
        <button type="button" class="modal-close" data-close aria-label="Закрыть">×</button>
      </header>
      <div class="modal-tabs" id="modal-tabs" hidden>
        <button type="button" class="tab active" data-tab="total">Итого</button>
        <button type="button" class="tab" data-tab="r1">Раунд 1</button>
        <button type="button" class="tab" data-tab="r2">Раунд 2</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
