<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BlackBerry КВ — слоты месяца</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="wrap">
    <header class="head">
      <p class="brand">BlackBerry</p>
      <h1 id="title">КВ — слоты месяца</h1>
      <div class="stats" id="stats"></div>
    </header>
    <section>
      <h2>Все слоты месяца</h2>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Дата</th>
              <th class="num">МСК</th>
              <th>Соперник</th>
              <th>Карта</th>
              <th class="ctr">Формат</th>
              <th>Сервер</th>
              <th class="ctr">Состав</th>
              <th class="ctr">Счёт</th>
              <th class="num">R1</th>
              <th class="num">R2</th>
              <th>Статус</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p class="note" id="note"></p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
